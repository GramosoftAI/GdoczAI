<!-- Forgot Password -->
<form [formGroup]="fpasswordForm" (ngSubmit)="onSubmit()" novalidate>
  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" formControlName="email" class="form-control"
      [ngClass]="{'is-invalid': (submitted || fpasswordForm.get('email')?.touched) && fpasswordForm.get('email')?.invalid}" />
    @if ((submitted || fpasswordForm.get('email')?.touched) && fpasswordForm.get('email')?.invalid){
    <div class="error-message">
      @if (fpasswordForm.get('email')?.errors?.['required']){
      <div>Email is required.</div>
      }
      @if (fpasswordForm.get('email')?.errors?.['pattern']) {
      <div>Enter valid email address.</div>
      }
    </div>
    }
  </div>

  <!-- Submit Button -->
  <button type="submit" class="btn-login">Reset Password</button>
</form>
