<!-- toastr.html -->
<div class="toastr-container" [class]="positionClass">
  @for (toast of toasts; track toast.id) {
    <div
      class="toastr"
      [class]="getToastClasses(toast)"
      [style.opacity]="toast.visible ? 1 : 0"
      (click)="removeToast(toast.id)">

      <!-- Progress Bar (Optional) -->
       @if (toast.duration > 0) {
        <div class="toastr-progress">
        <div class="toastr-progress-bar" [style.animation-duration]="toast.duration + 'ms'"></div>
      </div>
       }

      <div class="toastr-icon">
        @switch (toast.type) {
          @case ('success') { ✓ }
          @case ('error') { ⚠ }
          @case ('warning') { ⚡ }
          @case ('info') { ℹ }
        }
      </div>

      <div class="toastr-content">
        <div class="toastr-message">{{ toast.message }}</div>
      </div>

      <button class="toastr-close" (click)="removeToast(toast.id); $event.stopPropagation()">
        ×
      </button>
    </div>
  }
</div>
